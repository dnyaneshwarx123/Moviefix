<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie | MovieFix Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="top">
        <a href="index.html" class="brand">
            Movie<span>Fix</span> Admin
        </a>

        <a href="../Client%20Side%20Web%20pages/index.html" class="muted">
            View Client Site ↗
        </a>
    </header>

    <div class="layout">

        <aside class="side">
            <a href="index.html">Dashboard</a>
            <a href="manage-movies.html" class="active">Movies</a>
            <a href="users.html">Users</a>
            <a href="reviews.html">Reviews</a>
            <a href="settings.html">Settings</a>

            <a href="../Client%20Side%20Web%20pages/index.html">
                Open Client Site
            </a>

            <a href="../index.html">
                Back to Project
            </a>
        </aside>

        <main class="main">

            <div class="head">
                <div>
                    <div class="muted">ADMIN SIDE</div>
                    <h1>Add / Edit Movie</h1>
                </div>
            </div>

            <div class="panel">

                <form class="form"
                    onsubmit="event.preventDefault(); toast('Movie saved successfully')">

                    <label>
                        Movie Title
                        <input
                            type="text"
                            required
                            placeholder="Enter movie title">
                    </label>

                    <label>
                        Genre
                        <select>
                            <option>Action</option>
                            <option>Adventure</option>
                            <option>Comedy</option>
                            <option>Drama</option>
                            <option>Horror</option>
                            <option>Sci-Fi</option>
                        </select>
                    </label>

                    <label>
                        Release Year
                        <input
                            type="number"
                            placeholder="2026">
                    </label>

                    <label>
                        Duration
                        <input
                            type="text"
                            placeholder="2h 30m">
                    </label>

                    <label>
                        Rating
                        <input
                            type="number"
                            min="0"
                            max="10"
                            step="0.1"
                            placeholder="8.5">
                    </label>

                    <label>
                        Poster
                        <input
                            type="file"
                            accept="image/*">
                    </label>

                    <label class="wide">
                        Description
                        <textarea
                            placeholder="Enter movie description"></textarea>
                    </label>

                    <div class="actions wide">
                        <button
                            type="button"
                            class="btn dark"
                            onclick="history.back()">
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="btn red">
                            Save Movie
                        </button>
                    </div>

                </form>

            </div>

        </main>

    </div>

</body>

</html>
